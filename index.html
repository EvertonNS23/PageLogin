<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- ===================== PAINEL LATERAL (IMAGEM) ===================== -->
    <aside class="side-panel">
      <div class="side-overlay"></div>

      <div class="side-content">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2L36 11V29L20 38L4 29V11L20 2Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M20 2V20L4 11" stroke="currentColor" stroke-width="1.6"/>
            <path d="M20 20L36 11" stroke="currentColor" stroke-width="1.6"/>
            <path d="M20 20V38" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <span class="brand-name">VECTOR</span>
        </div>

        <div class="side-footer">
          <span class="accent-bar"></span>
          <div class="side-text">
            <h1 class="titulo-login">Bem-vindo<br> de volta</h1>
            <p>Que bom ter você de novo por aqui.<br>Vamos continuar de onde você parou.</p>
          </div>
          <span class="copyright">© 2026 VETO. Todos os direitos reservados.</span>
        </div>
      </div>
    </aside>

    <!-- ===================== FORMULÁRIO DE LOGIN ===================== -->
    <main class="form-panel">

      <form id="login-form" class="login-card" novalidate>

        <div class="login-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L22 6.8V17.2L12 22L2 17.2V6.8L12 2Z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M12 2V12L2 6.8" stroke="currentColor" stroke-width="1.4"/>
            <path d="M12 12L22 6.8" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </div>

        <h2 class="titulo-login">Login</h2>
        <p class="login-subtitle">Entre na sua conta para continuar</p>

        <!-- E-mail -->
        <div class="field">
          <label for="email">Endereço de e-mail</label>
          <div class="input-wrap" data-field="email">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 6.5C3 5.67 3.67 5 4.5 5H19.5C20.33 5 21 5.67 21 6.5V17.5C21 18.33 20.33 19 19.5 19H4.5C3.67 19 3 18.33 3 17.5V6.5Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 6.5L12 12.5L20 6.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <!-- Senha -->
        <div class="field">
          <label for="password">Senha</label>
          <div class="input-wrap" data-field="password">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10.5" width="14" height="9.5" rx="1.6" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 10.5V7.5C8 5.29 9.79 3.5 12 3.5C14.21 3.5 16 5.29 16 7.5V10.5" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
            <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M10.6 5.63C11.06 5.55 11.53 5.5 12 5.5C18.5 5.5 22 12 22 12C21.4 13.1 20.6 14.15 19.65 15.05M6.2 6.7C3.8 8.3 2 12 2 12C2 12 5.5 18.5 12 18.5C13.6 18.5 14.98 18.1 16.15 17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M9.9 9.9C9.35 10.45 9 11.2 9 12C9 13.66 10.34 15 12 15C12.8 15 13.55 14.65 14.1 14.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="field-actions">
          <a href="#" class="forgot-link" id="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Login</span>
          <span class="btn-spinner" aria-hidden="true"></span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>

        <div class="divider"><span>ou continue com</span></div>

        <div class="social-row">
          <button type="button" class="social-btn" data-provider="google" aria-label="Continuar com o Google">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.15.8 3.9 1.5l2.65-2.5C16.85 3.05 14.65 2 12 2 6.9 2 2.8 6.1 2.8 11.8S6.9 21.6 12 21.6c6.9 0 9.6-4.8 9.6-7.3 0-.5-.05-.9-.13-1.3H12z"/></svg>
          </button>
          <button type="button" class="social-btn" data-provider="apple" aria-label="Continuar com a Apple">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16.365 1.43c0 1.14-.468 2.098-1.144 2.816-.734.78-1.92 1.386-2.94 1.306-.132-1.098.442-2.25 1.14-2.976C14.15 1.79 15.4 1.19 16.365 1.43zM20.5 17.34c-.53 1.22-.78 1.77-1.46 2.85-.95 1.5-2.29 3.37-3.95 3.39-1.47.02-1.85-.96-3.84-.95-1.99.01-2.41.97-3.88.95-1.66-.02-2.93-1.7-3.88-3.2C1.14 16.98.3 12.4 1.7 9.45c.83-1.76 2.32-2.87 3.94-2.9 1.5-.03 2.92.99 3.84.99.92 0 2.65-1.22 4.47-1.04.76.03 2.9.31 4.27 2.32-.11.07-2.55 1.49-2.53 4.44.03 3.52 3.09 4.7 3.13 4.72-.02.07-.5 1.68-1.32 3.36z"/></svg>
          </button>
          <button type="button" class="social-btn" data-provider="github" aria-label="Continuar com o GitHub">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.19c0 4.49 2.87 8.3 6.84 9.65.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.72-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.36-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.73 0 0 .84-.271.75-1.18.53.13 1.09-1.31 1.75-1.31.66 0 1.22.13 1.75-1.31.91.91 1.75 1.18 1.75 1.18.55 1.42.2 2.47.1 2.73.64.72 1.03 1.64 1.03 2.76 0 3.94-2.35 4.8-4.58 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.19C22 6.58 17.52 2 12 2z"/></svg>
          </button>
        </div>

        <p class="signup-line">Não tem uma conta? <a href="#" id="signup-link">Cadastre-se</a></p>
      </form>

      <p class="secure-note">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L20 5.5V11C20 15.9 16.9 20.2 12 22C7.1 20.2 4 15.9 4 11V5.5L12 2Z" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Seus dados estão seguros conosco
      </p>
    </main>

  </div>

<script src="script.js"></script>
</body>
</html>
